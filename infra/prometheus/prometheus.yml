global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: scoregrid-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["api-gateway:8080"]
        labels: {service: api-gateway}
      - targets: ["auth-service:8081"]
        labels: {service: auth-service}
      - targets: ["tournament-service:8082"]
        labels: {service: tournament-service}
      - targets: ["prediction-service:8083"]
        labels: {service: prediction-service}
      - targets: ["score-service:8084"]
        labels: {service: score-service}
      - targets: ["eureka-server:8761"]
        labels: {service: eureka-server}

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
