name: CI

on:
  pull_request:
  push:
    branches: [main]

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  services:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      # One red service should not hide the state of the other four.
      fail-fast: false
      matrix:
        service:
          - api-gateway
          - auth-service
          - tournament-service
          - prediction-service
          - score-service
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Testcontainers talks to the Docker daemon that is already running on
      # the runner. Nothing to install.
      - name: Build and test
        working-directory: services/${{ matrix.service }}
        run: ./mvnw -B --no-transfer-progress verify
        env:
          # SecurityConfig refuses to start on a secret under 32 bytes, so the
          # context-load tests need a real-shaped value. Not a secret: CI only.
          SCOREGRID_JWT_SECRET: ci-only-placeholder-secret-value-at-least-32-bytes

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      # tsc -b then vite build: a type error fails the build here rather than
      # in someone else's branch.
      - name: Build
        working-directory: frontend
        run: npm run build

  compose:
    name: compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # compose.yaml interpolates from .env; the example holds the same keys.
      - name: Validate compose file
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile observability config --quiet
