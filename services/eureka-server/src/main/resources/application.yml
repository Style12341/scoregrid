spring:
  application:
    name: eureka-server

server:
  port: 8761
  shutdown: graceful

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
  server:
    enable-self-preservation: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Latency buckets, so the Grafana dashboard can show p95 per instance.
        http.server.requests: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  level:
    com.scoregrid: INFO

---
spring:
  config:
    activate:
      on-profile: docker

# Demo-speed registry for the containerised stack (defaults: 60 s eviction
# sweep, 30 s read-only response cache). Together with the clients' 5 s
# heartbeats and fetches, a replica that stops or starts is visible to the
# gateway within seconds. Self-preservation is already off above, so expired
# leases are actually evicted.
eureka:
  server:
    eviction-interval-timer-in-ms: 5000
    response-cache-update-interval-ms: 5000

logging:
  structured:
    format:
      console: logstash
