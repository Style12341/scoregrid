spring:
  application:
    name: auth-service

  datasource:
    # Defaults target the shared local Postgres from compose (host port 5433),
    # using this service's own role. Start it with:
    #   docker compose up -d postgres
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/scoregrid_auth}
    username: ${SPRING_DATASOURCE_USERNAME:auth_service}
    password: ${SPRING_DATASOURCE_PASSWORD:scoregrid}

  jpa:
    # validate, never update. A drifted entity fails at startup instead of at 2am.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

server:
  port: 8081
  shutdown: graceful

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}

scoregrid:
  jwt:
    secret: ${SCOREGRID_JWT_SECRET:dev-only-insecure-secret-do-not-deploy-anywhere-real}
    issuer: ${SCOREGRID_JWT_ISSUER:scoregrid-auth}
    ttl: ${SCOREGRID_JWT_TTL:PT24H}
  admin:
    # The password is deliberately not committed. It is required when the
    # initial account has to be created and is ignored for an existing account.
    username: ${SCOREGRID_ADMIN_USERNAME:admin}
    email: ${SCOREGRID_ADMIN_EMAIL:admin@scoregrid.local}
    password: ${SCOREGRID_ADMIN_PASSWORD:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Readiness must fail when the datastore is unreachable. With only
        # readinessState the container reports healthy while every request
        # that touches data would fail.
        readiness:
          include: readinessState, db
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Latency buckets, so the Grafana dashboard can show p95 per instance.
        http.server.requests: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        # Off here, so ./mvnw runs and tests never post spans to a missing
        # localhost:9411. compose.yaml turns it on and points it at Tempo.
        enabled: false
  observations:
    enable:
      # Spring Security adds five spans to every request (filter chain,
      # authentication, authorization), which bury the service-to-service
      # hops in each trace.
      spring.security: false

logging:
  level:
    com.scoregrid: DEBUG

---
# ── docker profile ───────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: docker

# Demo-speed discovery for the containerised stack, so a stopped or new
# replica shows up in every client's routing table within seconds instead of
# the ~90 s the defaults add up to. Local ./mvnw runs keep the defaults; CI
# runs with Eureka disabled. Same values in every service; see
# docs/demo.md#failover.
eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
    # Eureka's Lease doubles this: renew() stores now+duration and isExpired()
    # adds duration again. 10 s means a SIGKILLed replica is evicted ~20 s
    # after its last heartbeat.
    lease-expiration-duration-in-seconds: 10
  client:
    registry-fetch-interval-seconds: 5

logging:
  # Structured JSON so Promtail can lift level into a Loki label and traceId
  # into structured metadata.
  structured:
    format:
      console: logstash
  level:
    com.scoregrid: INFO
