spring:
  application:
    name: auth-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/scoregrid_auth}
    username: ${SPRING_DATASOURCE_USERNAME:scoregrid}
    password: ${SPRING_DATASOURCE_PASSWORD:scoregrid}

  jpa:
    # validate, never update. A drifted entity fails at startup instead of at 2am.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  threads:
    virtual:
      enabled: true

server:
  port: 8081
  shutdown: graceful

scoregrid:
  jwt:
    secret: ${SCOREGRID_JWT_SECRET}
    issuer: ${SCOREGRID_JWT_ISSUER:scoregrid-auth}
    ttl: ${SCOREGRID_JWT_TTL:PT24H}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  level:
    com.scoregrid: DEBUG

---
# ── docker profile ───────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: docker

logging:
  # Structured JSON so Promtail can lift level/traceId into Loki labels.
  structured:
    format:
      console: logstash
  level:
    com.scoregrid: INFO
