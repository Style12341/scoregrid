spring:
  application:
    name: score-service

  # NOTE the namespace. Boot 4 moved every MongoDB *connection* property from
  # spring.data.mongodb.* to spring.mongodb.*. The old names are deprecated at
  # level "error": they bind to nothing, and the driver silently falls back to
  # mongodb://localhost/test. No warning, no failure at startup — just a health
  # endpoint reporting mongo DOWN.
  mongodb:
    # Defaults target the shared local MongoDB from compose (host port 27018),
    # using this service's own scoped user. authSource is this database, not
    # admin — the user exists here and has readWrite on nothing else.
    # Start it with:  docker compose up -d mongodb
    uri: ${SPRING_MONGODB_URI:mongodb://score_service:scoregrid@localhost:27018/scoregrid_score?authSource=scoregrid_score}

  data:
    mongodb:
      # Stays under spring.data.* — this one did NOT move.
      auto-index-creation: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:scoregrid}
    password: ${SPRING_RABBITMQ_PASSWORD:scoregrid}
    listener:
      simple:
        acknowledge-mode: auto
        # On exhaustion the message dead-letters instead of being requeued
        # forever. Scoring resumes later; nothing is lost.
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 4s

  threads:
    virtual:
      enabled: true

server:
  port: 8084
  shutdown: graceful

scoregrid:
  jwt:
    secret: ${SCOREGRID_JWT_SECRET:dev-only-insecure-secret-do-not-deploy-anywhere-real}
    issuer: ${SCOREGRID_JWT_ISSUER:scoregrid-auth}

  clients:
    prediction:
      base-url: ${SCOREGRID_CLIENTS_PREDICTION_BASE_URL:http://localhost:8083}
    auth:
      base-url: ${SCOREGRID_CLIENTS_AUTH_BASE_URL:http://localhost:8081}

  # Scoring rule v1. Exact implies outcome — award 3, not 4.
  # Contract and test table: docs/contracts.md#scoring-rule-v1
  scoring:
    points-exact-score: 3
    points-correct-outcome: 1

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Readiness must fail when the datastore is unreachable. With only
        # readinessState the container reports healthy while every request
        # that touches data would fail.
        readiness:
          include: readinessState, mongo
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  level:
    com.scoregrid: DEBUG

---
# ── docker profile ───────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: docker

logging:
  structured:
    format:
      console: logstash
  level:
    com.scoregrid: INFO
