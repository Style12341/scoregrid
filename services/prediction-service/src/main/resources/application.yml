spring:
  application:
    name: prediction-service

  # NOTE the namespace. Boot 4 moved every MongoDB *connection* property from
  # spring.data.mongodb.* to spring.mongodb.*. The old names are deprecated at
  # level "error": they bind to nothing, and the driver silently falls back to
  # mongodb://localhost/test. No warning, no failure at startup — just a health
  # endpoint reporting mongo DOWN.
  mongodb:
    # Defaults target the shared local MongoDB from compose (host port 27018),
    # using this service's own scoped user. authSource is this database, not
    # admin — the user exists here and has readWrite on nothing else.
    # Start it with:  docker compose up -d mongodb
    uri: ${SPRING_MONGODB_URI:mongodb://prediction_service:scoregrid@localhost:27018/scoregrid_prediction?authSource=scoregrid_prediction}

  data:
    mongodb:
      # Stays under spring.data.* — this one did NOT move. It is what creates
      # the unique index on (userId, matchId); see hard rule 7.
      auto-index-creation: true

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:scoregrid}
    password: ${SPRING_RABBITMQ_PASSWORD:scoregrid}
    publisher-confirm-type: correlated
    # Trace context crosses RabbitMQ in the message headers: the template
    # writes it, the listener continues it. Both are off by default.
    template:
      observation-enabled: true
    listener:
      simple:
        observation-enabled: true
        acknowledge-mode: auto
        default-requeue-rejected: false
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 1s
          multiplier: 2
          max-interval: 4s

  threads:
    virtual:
      enabled: true

server:
  port: 8083
  shutdown: graceful

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}

scoregrid:
  jwt:
    secret: ${SCOREGRID_JWT_SECRET:dev-only-insecure-secret-do-not-deploy-anywhere-real}
    issuer: ${SCOREGRID_JWT_ISSUER:scoregrid-auth}

  clients:
    # Timeouts of the @LoadBalanced RestClient, applied in ClientConfig. Not
    # spring.http.clients.*: the Boot module that binds those is not on this
    # service's classpath, so they would be ignored without a word.
    # ResilienceConfig's 2.2 s time limit is sized from these two: change them
    # together. A cache-miss POST /api/predictions makes three of these
    # requests in a row, and with one tournament replica dead they must still
    # add up to well under the gateway's 5 s read timeout.
    connect-timeout: ${SCOREGRID_CLIENTS_CONNECT_TIMEOUT:500ms}
    read-timeout: ${SCOREGRID_CLIENTS_READ_TIMEOUT:1500ms}
    # Used only on match-cache miss. The cache is fed by match.scheduled /
    # match.updated events — see docs/contracts.md#events--rabbitmq.
    tournament:
      base-url: ${SCOREGRID_CLIENTS_TOURNAMENT_BASE_URL:http://tournament-service}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Readiness must fail when the datastore is unreachable. With only
        # readinessState the container reports healthy while every request
        # that touches data would fail.
        readiness:
          include: readinessState, mongo
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        # Off here, so ./mvnw runs and tests never post spans to a missing
        # localhost:9411. compose.yaml turns it on and points it at Tempo.
        enabled: false
  observations:
    enable:
      # Spring Security adds five spans to every request (filter chain,
      # authentication, authorization), which bury the service-to-service
      # hops in each trace.
      spring.security: false

logging:
  level:
    com.scoregrid: DEBUG

---
# ── docker profile ───────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: docker
  cloud:
    loadbalancer:
      cache:
        # Default 35 s: a dead replica of a service this one calls would stay
        # in the @LoadBalanced RestClient's instance list that long.
        ttl: 5s

# Demo-speed discovery for the containerised stack, so a stopped or new
# replica shows up in every client's routing table within seconds instead of
# the ~90 s the defaults add up to. Local ./mvnw runs keep the defaults; CI
# runs with Eureka disabled. Same values in every service; see
# docs/demo.md#failover.
eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
    # Eureka's Lease doubles this: renew() stores now+duration and isExpired()
    # adds duration again. 10 s means a SIGKILLed replica is evicted ~20 s
    # after its last heartbeat.
    lease-expiration-duration-in-seconds: 10
  client:
    registry-fetch-interval-seconds: 5

logging:
  structured:
    format:
      console: logstash
  level:
    com.scoregrid: INFO
