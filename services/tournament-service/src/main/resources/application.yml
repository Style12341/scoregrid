spring:
  application:
    name: tournament-service

  datasource:
    # Defaults target the shared local Postgres from compose (host port 5433),
    # using this service's own role. Start it with:
    #   docker compose up -d postgres
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/scoregrid_tournament}
    username: ${SPRING_DATASOURCE_USERNAME:tournament_service}
    password: ${SPRING_DATASOURCE_PASSWORD:scoregrid}

  jpa:
    # validate, never update. A drifted entity fails at startup instead of at 2am.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:scoregrid}
    password: ${SPRING_RABBITMQ_PASSWORD:scoregrid}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
      # Carries the trace context into the message headers, so the consumer's
      # span joins the publisher's trace (off by default in Spring AMQP).
      observation-enabled: true

  threads:
    virtual:
      enabled: true

server:
  port: 8082
  # Immediate, not graceful: a stopping replica must refuse new connections at
  # once, so the gateway's connect-failure retry moves the request to the other
  # replica. Graceful shutdown pauses the connector, and new connections hang
  # until the gateway's read timeout, which is never retried.
  shutdown: immediate

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}

scoregrid:
  jwt:
    secret: ${SCOREGRID_JWT_SECRET:dev-only-insecure-secret-do-not-deploy-anywhere-real}
    issuer: ${SCOREGRID_JWT_ISSUER:scoregrid-auth}

  # External results provider. Off by default — manual result loading is the
  # primary path and must always work. See docs/PRD.md#resolved-decisions.
  results-provider:
    enabled: ${SCOREGRID_RESULTS_PROVIDER_ENABLED:false}
    base-url: ${SCOREGRID_RESULTS_PROVIDER_BASE_URL:}
    api-key: ${SCOREGRID_RESULTS_PROVIDER_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Readiness must fail when the datastore is unreachable. With only
        # readinessState the container reports healthy while every request
        # that touches data would fail.
        readiness:
          include: readinessState, db
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
    distribution:
      percentiles-histogram:
        # Latency buckets, so the Grafana dashboard can show p95 per instance.
        http.server.requests: true
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}
    export:
      zipkin:
        # Off here, so ./mvnw runs and tests never post spans to a missing
        # localhost:9411. compose.yaml turns it on and points it at Tempo.
        enabled: false
  observations:
    enable:
      # Spring Security adds five spans to every request (filter chain,
      # authentication, authorization), which bury the service-to-service
      # hops in each trace.
      spring.security: false

# JDBC tracing (datasource-micrometer). Query spans only: the default also
# records a span per connection, result set and generated key, which multiply
# the span count without saying anything new. Parameter values are not
# recorded (jdbc.datasource-proxy.include-parameter-values defaults to false):
# a span carries the SQL with its ? placeholders, never the values. Keep it so.
jdbc:
  includes: query

logging:
  level:
    com.scoregrid: DEBUG

---
# ── docker profile ───────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: docker

# Demo-speed discovery for the containerised stack, so a stopped or new
# replica shows up in every client's routing table within seconds instead of
# the ~90 s the defaults add up to. Local ./mvnw runs keep the defaults; CI
# runs with Eureka disabled. Same values in every service; see
# docs/demo.md#failover.
eureka:
  instance:
    lease-renewal-interval-in-seconds: 5
    # Eureka's Lease doubles this: renew() stores now+duration and isExpired()
    # adds duration again. 10 s means a SIGKILLed replica is evicted ~20 s
    # after its last heartbeat.
    lease-expiration-duration-in-seconds: 10
  client:
    registry-fetch-interval-seconds: 5

logging:
  structured:
    format:
      console: logstash
  level:
    com.scoregrid: INFO
