spring:
  application:
    name: tournament-service

  datasource:
    # Defaults target the shared local Postgres from compose (host port 5433),
    # using this service's own role. Start it with:
    #   docker compose up -d postgres
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/scoregrid_tournament}
    username: ${SPRING_DATASOURCE_USERNAME:tournament_service}
    password: ${SPRING_DATASOURCE_PASSWORD:scoregrid}

  jpa:
    # validate, never update. A drifted entity fails at startup instead of at 2am.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:scoregrid}
    password: ${SPRING_RABBITMQ_PASSWORD:scoregrid}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  threads:
    virtual:
      enabled: true

server:
  port: 8082
  shutdown: graceful

eureka:
  client:
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: ${EUREKA_INSTANCE_PREFER_IP_ADDRESS:true}

scoregrid:
  jwt:
    secret: ${SCOREGRID_JWT_SECRET:dev-only-insecure-secret-do-not-deploy-anywhere-real}
    issuer: ${SCOREGRID_JWT_ISSUER:scoregrid-auth}

  # External results provider. Off by default — manual result loading is the
  # primary path and must always work. See docs/PRD.md#resolved-decisions.
  results-provider:
    enabled: ${SCOREGRID_RESULTS_PROVIDER_ENABLED:false}
    base-url: ${SCOREGRID_RESULTS_PROVIDER_BASE_URL:}
    api-key: ${SCOREGRID_RESULTS_PROVIDER_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Readiness must fail when the datastore is unreachable. With only
        # readinessState the container reports healthy while every request
        # that touches data would fail.
        readiness:
          include: readinessState, db
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  level:
    com.scoregrid: DEBUG

---
# ── docker profile ───────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: docker

logging:
  structured:
    format:
      console: logstash
  level:
    com.scoregrid: INFO
