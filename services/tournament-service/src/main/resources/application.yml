spring:
  application:
    name: tournament-service

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/scoregrid_tournament}
    username: ${SPRING_DATASOURCE_USERNAME:scoregrid}
    password: ${SPRING_DATASOURCE_PASSWORD:scoregrid}

  jpa:
    # validate, never update. A drifted entity fails at startup instead of at 2am.
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  rabbitmq:
    host: ${SPRING_RABBITMQ_HOST:localhost}
    port: ${SPRING_RABBITMQ_PORT:5672}
    username: ${SPRING_RABBITMQ_USERNAME:scoregrid}
    password: ${SPRING_RABBITMQ_PASSWORD:scoregrid}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true

  threads:
    virtual:
      enabled: true

server:
  port: 8082
  shutdown: graceful

scoregrid:
  jwt:
    secret: ${SCOREGRID_JWT_SECRET}
    issuer: ${SCOREGRID_JWT_ISSUER:scoregrid-auth}

  # External results provider. Off by default — manual result loading is the
  # primary path and must always work. See docs/PRD.md#resolved-decisions.
  results-provider:
    enabled: ${SCOREGRID_RESULTS_PROVIDER_ENABLED:false}
    base-url: ${SCOREGRID_RESULTS_PROVIDER_BASE_URL:}
    api-key: ${SCOREGRID_RESULTS_PROVIDER_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
  metrics:
    tags:
      application: ${spring.application.name}
  tracing:
    sampling:
      probability: ${MANAGEMENT_TRACING_SAMPLING_PROBABILITY:1.0}

logging:
  level:
    com.scoregrid: DEBUG

---
# ── docker profile ───────────────────────────────────────────────────────────
spring:
  config:
    activate:
      on-profile: docker

logging:
  structured:
    format:
      console: logstash
  level:
    com.scoregrid: INFO
