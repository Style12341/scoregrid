name: scoregrid

# ─────────────────────────────────────────────────────────────────────────────
# ScoreGrid — full local environment.
#
#   docker compose up -d postgres mongodb rabbitmq  infra only — the usual case
#                                                   when running services from
#                                                   the IDE or ./mvnw
#   docker compose up -d --build                    whole system (9 containers)
#   docker compose --profile observability up -d    + Prometheus, Grafana, Loki
#
# Storage is one Postgres and one MongoDB, each holding one database per
# service with its own least-privilege login. PRD requirement 6 asks for at
# least one SQL and one NoSQL store, not one container per service; four
# database containers cost roughly 400 MB on a laptop to enforce a boundary the
# engines already enforce (neither Postgres nor Mongo can query across
# databases). Provisioning lives in infra/postgres/init and infra/mongo/init.
#
# Host ports are offset (5433 for Postgres, 27018 for Mongo) so they never
# collide with an installation already on your machine. Inside the network,
# services talk on standard ports via container names.
# ─────────────────────────────────────────────────────────────────────────────

x-service-defaults: &service-defaults
  restart: unless-stopped
  networks: [scoregrid]
  environment: &service-env
    TZ: UTC
    SPRING_PROFILES_ACTIVE: docker
    SCOREGRID_JWT_SECRET: ${SCOREGRID_JWT_SECRET:?set SCOREGRID_JWT_SECRET in .env}
    SCOREGRID_JWT_ISSUER: ${SCOREGRID_JWT_ISSUER:-scoregrid-auth}
    MANAGEMENT_TRACING_SAMPLING_PROBABILITY: "1.0"

x-healthcheck-defaults: &healthcheck-defaults
  interval: 10s
  timeout: 5s
  retries: 12
  start_period: 60s

services:

  # ══ Databases ══════════════════════════════════════════════════════════════

  # One Postgres instance, one database per service, one login role per
  # database. PRD requirement 6 asks for at least one SQL and one NoSQL store,
  # not four containers — and PostgreSQL cannot join across databases, so
  # "a service touches only its own database" stays enforced by the engine.
  postgres:
    image: postgres:17-alpine
    container_name: sg-postgres
    restart: unless-stopped
    networks: [scoregrid]
    environment:
      # Superuser and maintenance database. No service ever uses these: the
      # init script hands each service its own least-privilege role.
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_ROOT_USER:-scoregrid}
      POSTGRES_PASSWORD: ${POSTGRES_ROOT_PASSWORD:?set POSTGRES_ROOT_PASSWORD in .env}
      # Consumed by infra/postgres/init/01-init-databases.sh.
      POSTGRES_AUTH_DB: ${POSTGRES_AUTH_DB:-scoregrid_auth}
      POSTGRES_AUTH_USER: ${POSTGRES_AUTH_USER:-auth_service}
      POSTGRES_AUTH_PASSWORD: ${POSTGRES_AUTH_PASSWORD:?set POSTGRES_AUTH_PASSWORD in .env}
      POSTGRES_TOURNAMENT_DB: ${POSTGRES_TOURNAMENT_DB:-scoregrid_tournament}
      POSTGRES_TOURNAMENT_USER: ${POSTGRES_TOURNAMENT_USER:-tournament_service}
      POSTGRES_TOURNAMENT_PASSWORD: ${POSTGRES_TOURNAMENT_PASSWORD:?set POSTGRES_TOURNAMENT_PASSWORD in .env}
    ports: ["5433:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Runs once, on an empty data volume. Changing it later needs the volume
      # dropped: docker compose down -v
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_ROOT_USER:-scoregrid} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s

  # One MongoDB instance, one database per service, one scoped user per
  # database. Authentication is on: with a shared instance it is the only thing
  # keeping score-service out of prediction data.
  mongodb:
    image: mongo:8
    container_name: sg-mongodb
    restart: unless-stopped
    networks: [scoregrid]
    environment:
      # Setting these switches mongod into --auth mode.
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-scoregrid}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in .env}
      # Consumed by infra/mongo/init/01-init-users.js.
      MONGO_PREDICTION_DB: ${MONGO_PREDICTION_DB:-scoregrid_prediction}
      MONGO_PREDICTION_USER: ${MONGO_PREDICTION_USER:-prediction_service}
      MONGO_PREDICTION_PASSWORD: ${MONGO_PREDICTION_PASSWORD:?set MONGO_PREDICTION_PASSWORD in .env}
      MONGO_SCORE_DB: ${MONGO_SCORE_DB:-scoregrid_score}
      MONGO_SCORE_USER: ${MONGO_SCORE_USER:-score_service}
      MONGO_SCORE_PASSWORD: ${MONGO_SCORE_PASSWORD:?set MONGO_SCORE_PASSWORD in .env}
    ports: ["27018:27017"]
    volumes:
      - mongodata:/data/db
      - ./infra/mongo/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      # $$ escapes compose interpolation so the shell inside the container
      # expands these, keeping the password out of the compose config output.
      test: ["CMD-SHELL", "mongosh --quiet -u \"$$MONGO_INITDB_ROOT_USERNAME\" -p \"$$MONGO_INITDB_ROOT_PASSWORD\" --authenticationDatabase admin --eval \"db.adminCommand('ping').ok\" | grep -q 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ══ Messaging ══════════════════════════════════════════════════════════════

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: sg-rabbitmq
    restart: unless-stopped
    networks: [scoregrid]
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-scoregrid}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-scoregrid}
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # management UI
    volumes: ["rabbitdata:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ══ Services ═══════════════════════════════════════════════════════════════

  auth-service:
    <<: *service-defaults
    build: ./services/auth-service
    container_name: sg-auth-service
    ports: ["8081:8081"]
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_AUTH_DB:-scoregrid_auth}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_AUTH_USER:-auth_service}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_AUTH_PASSWORD:?set POSTGRES_AUTH_PASSWORD in .env}
      SCOREGRID_JWT_TTL: ${SCOREGRID_JWT_TTL:-PT24H}
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-qO-", "http://localhost:8081/actuator/health/readiness"]

  tournament-service:
    <<: *service-defaults
    build: ./services/tournament-service
    container_name: sg-tournament-service
    ports: ["8082:8082"]
    environment:
      <<: *service-env
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_TOURNAMENT_DB:-scoregrid_tournament}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_TOURNAMENT_USER:-tournament_service}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_TOURNAMENT_PASSWORD:?set POSTGRES_TOURNAMENT_PASSWORD in .env}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-scoregrid}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-scoregrid}
      SCOREGRID_RESULTS_PROVIDER_ENABLED: ${RESULTS_PROVIDER_ENABLED:-false}
      SCOREGRID_RESULTS_PROVIDER_BASE_URL: ${RESULTS_PROVIDER_BASE_URL:-}
      SCOREGRID_RESULTS_PROVIDER_API_KEY: ${RESULTS_PROVIDER_API_KEY:-}
    depends_on:
      postgres: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-qO-", "http://localhost:8082/actuator/health/readiness"]

  prediction-service:
    <<: *service-defaults
    build: ./services/prediction-service
    container_name: sg-prediction-service
    ports: ["8083:8083"]
    environment:
      <<: *service-env
      # authSource is the service's own database, not admin — the user was
      # created there and has readWrite on nothing else.
      SPRING_MONGODB_URI: mongodb://${MONGO_PREDICTION_USER:-prediction_service}:${MONGO_PREDICTION_PASSWORD:?set MONGO_PREDICTION_PASSWORD in .env}@mongodb:27017/${MONGO_PREDICTION_DB:-scoregrid_prediction}?authSource=${MONGO_PREDICTION_DB:-scoregrid_prediction}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-scoregrid}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-scoregrid}
      SCOREGRID_CLIENTS_TOURNAMENT_BASE_URL: http://tournament-service:8082
    depends_on:
      mongodb: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-qO-", "http://localhost:8083/actuator/health/readiness"]

  score-service:
    <<: *service-defaults
    build: ./services/score-service
    container_name: sg-score-service
    ports: ["8084:8084"]
    environment:
      <<: *service-env
      SPRING_MONGODB_URI: mongodb://${MONGO_SCORE_USER:-score_service}:${MONGO_SCORE_PASSWORD:?set MONGO_SCORE_PASSWORD in .env}@mongodb:27017/${MONGO_SCORE_DB:-scoregrid_score}?authSource=${MONGO_SCORE_DB:-scoregrid_score}
      SPRING_RABBITMQ_HOST: rabbitmq
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-scoregrid}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-scoregrid}
      SCOREGRID_CLIENTS_PREDICTION_BASE_URL: http://prediction-service:8083
      SCOREGRID_CLIENTS_AUTH_BASE_URL: http://auth-service:8081
    depends_on:
      mongodb: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-qO-", "http://localhost:8084/actuator/health/readiness"]

  api-gateway:
    <<: *service-defaults
    build: ./services/api-gateway
    container_name: sg-api-gateway
    ports: ["8080:8080"]
    environment:
      <<: *service-env
      SCOREGRID_ROUTES_AUTH_URI: http://auth-service:8081
      SCOREGRID_ROUTES_TOURNAMENT_URI: http://tournament-service:8082
      SCOREGRID_ROUTES_PREDICTION_URI: http://prediction-service:8083
      SCOREGRID_ROUTES_SCORE_URI: http://score-service:8084
      SCOREGRID_CORS_ALLOWED_ORIGINS: ${FRONTEND_ORIGIN:-http://localhost:3000},http://localhost:5173
    depends_on:
      auth-service: {condition: service_healthy}
      tournament-service: {condition: service_healthy}
      prediction-service: {condition: service_healthy}
      score-service: {condition: service_healthy}
    healthcheck:
      <<: *healthcheck-defaults
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/actuator/health/readiness"]

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: sg-frontend
    restart: unless-stopped
    networks: [scoregrid]
    ports: ["3000:80"]
    depends_on:
      api-gateway: {condition: service_healthy}

  # ══ Observability — profile: observability ═════════════════════════════════

  prometheus:
    image: prom/prometheus:latest
    container_name: sg-prometheus
    profiles: [observability]
    restart: unless-stopped
    networks: [scoregrid]
    ports: ["9090:9090"]
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheusdata:/prometheus

  loki:
    image: grafana/loki:latest
    container_name: sg-loki
    profiles: [observability]
    restart: unless-stopped
    networks: [scoregrid]
    command: -config.file=/etc/loki/loki-config.yml
    ports: ["3100:3100"]
    volumes:
      - ./infra/loki/loki-config.yml:/etc/loki/loki-config.yml:ro
      - lokidata:/loki

  promtail:
    image: grafana/promtail:latest
    container_name: sg-promtail
    profiles: [observability]
    restart: unless-stopped
    networks: [scoregrid]
    command: -config.file=/etc/promtail/promtail-config.yml
    volumes:
      - ./infra/promtail/promtail-config.yml:/etc/promtail/promtail-config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on: [loki]

  grafana:
    image: grafana/grafana:latest
    container_name: sg-grafana
    profiles: [observability]
    restart: unless-stopped
    networks: [scoregrid]
    ports: ["3001:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus, loki]

networks:
  scoregrid:
    driver: bridge

volumes:
  pgdata:
  mongodata:
  rabbitdata:
  prometheusdata:
  lokidata:
  grafanadata:
